# Local runs of the Immitracker app — the same image in both deployment modes.
#
# Docker Desktop lists these under one project, each with its own Start button:
#
#   immitracker-prod   http://localhost:3001   password, starts empty, you upload
#   immitracker-demo   http://localhost:3002   no password, synthetic data, read-only
#
#   first time:  docker compose up -d --build
#   after that:  press Start in Docker Desktop, or `docker compose start`
#   one only:    docker compose up -d prod     (or: demo)
#
# Secrets live in .env, which is gitignored. Copy .env.example to .env and fill
# it in when setting this up on a new machine.

services:
  # ---------------- production ----------------
  # The operator's own instance: no data until you upload an export, and
  # everything behind the password from .env.
  prod:
    build:
      context: .
    image: immitracker:local
    container_name: immitracker-prod

    env_file:
      - .env
    environment:
      # Overrides whatever .env says, so this service cannot come up in the
      # wrong mode if that file is edited.
      APP_MODE: production
      # The demo's key is in .env too; keep it out of this container.
      GOOGLE_API_KEY_DEMO: ""

    ports:
      # Bound to loopback deliberately. Without the 127.0.0.1 prefix Docker
      # publishes on every interface, which would put the app — and any case
      # data uploaded into it — on the local network.
      - "127.0.0.1:3001:3001"

    volumes:
      # dataStore restores uploads from this directory at startup, so a named
      # volume keeps a dataset registered across image rebuilds. Without it,
      # every rebuild means re-uploading the export.
      - immitracker-uploads:/app/server/uploads

    healthcheck: &healthcheck
      # node's built-in fetch, because the slim runtime image has no curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # No restart policy on purpose: containers stay stopped until started
    # deliberately, rather than coming up whenever Docker Desktop launches.

  # ---------------- demo ----------------
  # The public showcase build: seeded with the synthetic sample dataset, uploads
  # and deletion refused, no password. Nothing real is ever loaded here.
  demo:
    build:
      context: .
    image: immitracker:local
    container_name: immitracker-demo

    env_file:
      - .env
    environment:
      APP_MODE: demo
      # Demo mode bypasses auth entirely, so these are unused. Blanked anyway so
      # a password never reaches a container that is meant to be open.
      APP_PASSWORD: ""
      SESSION_SECRET: ""
      # The demo bills to its own Google key, so public traffic never draws on
      # the production quota. No fallback: if GOOGLE_API_KEY_DEMO is unset the
      # demo runs without written commentary rather than borrowing prod's key.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY_DEMO:-}
      GOOGLE_API_KEY_DEMO: ""

    ports:
      - "127.0.0.1:3002:3001"

    # No volume: the sample dataset is baked into the image and uploads are
    # refused, so there is nothing to persist.

    healthcheck: *healthcheck

volumes:
  immitracker-uploads:
